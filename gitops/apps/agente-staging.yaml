# O que o Argo CD observa: "mantenha o namespace agente-staging igual a
# gitops/overlays/staging na branch main". O script subir-cluster.sh troca
# REPO_URL pelo endereço do SEU repositório.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agente-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: main
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true    # staging: auto-heal, desfaz qualquer mudança manual
