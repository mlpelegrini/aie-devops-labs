# Produção: o Argo CD aplica o que entra na main, mas NÃO desfaz mudança
# manual sozinho — só marca OutOfSync (drift) e alguém decide. Essa é uma
# das decisões do laboratório: troquem para selfHeal: true e justifiquem.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agente-producao
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: main
    path: gitops/overlays/producao
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
